<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f5f5f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141513" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="披花沐雪 - One Last Kiss for the Beautiful World，一个现代化的个人博客系统" />
    <meta name="keywords" content="博客,技术,前端,后端,Vue,Node.js" />
    <meta name="author" content="披花沐雪" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="披花沐雪" />
    <meta property="og:description" content="One Last Kiss for the Beautiful World" />
    <meta property="og:site_name" content="披花沐雪" />

    <title>披花沐雪</title>

    <!-- 首屏关键底色：在样式表到达之前就把纸色铺好，避免暗色用户看到白闪 -->
    <style>
      html {
        background: #f5f5f3;
      }
      html[data-theme='dark'] {
        background: #141513;
      }
      body {
        margin: 0;
        background: inherit;
      }
    </style>

    <script>
      ;(function () {
        var root = document.documentElement
        try {
          // 1) 主题：在首帧之前定妥，避免暗色用户刷新时白屏闪烁（FOUC）
          var saved = localStorage.getItem('theme')
          var dark =
            saved === 'dark' ||
            (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) root.dataset.theme = 'dark'

          // 2) 入场动效的开关令牌：只有脚本就绪时才允许 CSS 把元素藏起来。
          //    若脚本被拦截或抛错，页面回到「全部可见」的静态状态，绝不白屏。
          root.classList.add('js-reveal')
        } catch (e) {
          /* 隐私模式等场景下保持静态渲染 */
        }
      })()
    </script>

    <!-- 字体：国内镜像。CJK 家族按 Unicode 子集切分，浏览器只取实际用到的字形 -->
    <link rel="preconnect" href="https://fonts.loli.net" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.loli.net" />
    <link
      href="https://fonts.loli.net/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Source+Sans+3:wght@300;400;500;600;700&family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
